<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img id="light" src="off.png" alt="bulb" width="200px">
    <button onclick="onbulb()">onbulb</button>
    <button onclick="offbulb()">offbulb</button>
    <script>
        function onbulb(){
            let img=document.getElementById("light");
            if(img.src.includes("off.png")){
                img.src="on.png";
            }
        }
        function offbulb(){
            let img=document.getElementById("light");
            if(img.src.includes("on.png")){
                img.src="off.png";
            }
        }
    </script>
    
</body>
</html>
