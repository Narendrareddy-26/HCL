<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e5f7ff;
            font-family: Arial, Helvetica, sans-serif;
        }

        form{
            width: 320px;
            padding: 20px;
            background-color: rgb(135, 203, 222);
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        label{
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input{
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid gray;
        }

        .error{
            color: red;
            font-size: 14px;
        }

        button{
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
            border: none;
            background-color: blue;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <form onsubmit="return login()">
    <label for="mytext">USERNAME:</label>
    <input type="text" id="mytext" name="name" placeholder="username">
    <span id="nameerror" class="error"></span>
    <br><br>
    <label for="mypassword">PASSWORD:</label>
    <input type="password" id="mypassword" placeholder="user password">
    <span id="passworderror" class="error"></span>
    <br><br>
    <button type="submit">LOGIN</button>
    </form>
    <script>
        function login(){
        let name=document.getElementById("mytext").value.trim();
        let password=document.getElementById("mypassword").value.trim();
        let valid=true;
        document.getElementById("nameerror").innerHTML="";
        document.getElementById("passworderror").innerHTML="";
        if(name === ""){
            document.getElementById("nameerror").innerHTML="username is required";
            valid=false;
        }
        if(password.length<6){
            document.getElementById("passworderror").innerHTML="password should not be less than 6 chars";
            valid=false;
        }
        return valid;

        }
    </script>
    
</body>
</html>
